<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moview - Discover Your Next Favorite Movie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="logo">Moview</h1>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="favorites.html">My favorites</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h2>Discover Your Next Favorite Movie</h2>
            <p>Explore thousands of movies and find what to watch tonight</p>
        </div>
    </section>

    <section class="search-section">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for movies">
            <button id="searchBtn">Search</button>
        </div>
    </section>

    <section class="movies-section">
        <h3>Popular movies</h3>

        <div id="moviesGrid" class="movies-grid">
            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://picsum.photos/200/300?random=1" alt="Movie 1">
                </div>
                <div class="movie-info">
                    <h4 class="movie-title">The Dark Knight</h4>
                    <p class="movie-rating">⭐ 9.0</p>
                </div>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://picsum.photos/200/300?random=2" alt="Movie 2">
                </div>
                <div class="movie-info">
                    <h4 class="movie-title">Inception</h4>
                    <p class="movie-rating">⭐ 8.8</p>
                </div>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://picsum.photos/200/300?random=3" alt="Movie 3">
                </div>
                <div class="movie-info">
                    <h4 class="movie-title">Interstellar</h4>
                    <p class="movie-rating">⭐ 8.6</p>
                </div>
            </div>

            <div class="movie-card">
                <div class="movie-poster">
                    <img src="https://picsum.photos/200/300?random=4" alt="Movie 4">
                </div>
                <div class="movie-info">
                    <h4 class="movie-title">The Matrix</h4>
                    <p class="movie-rating">⭐ 8.7</p>
                </div>
            </div>

    </section>

    <footer class="footer">
        <p>&Copy; 2024 Moview. Made by Rafly</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
